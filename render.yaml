services:
  - type: web
    name: simbiz-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CORS_ORIGIN
        sync: false
      - key: SIMBIZ_DATA_DIR
        value: /var/data
      - key: SIMBIZ_STORAGE_MODE
        value: filesystem
      - key: DATABASE_URL
        sync: false
    disk:
      name: simbiz-data
      mountPath: /var/data
      sizeGB: 1
